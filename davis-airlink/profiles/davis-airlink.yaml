name: davis-airlink
components:
  - id: main
    capabilities:
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: veryFineDustSensor
        version: 1
      - id: veryFineDustHealthConcern
        version: 1
      - id: fineDustSensor
        version: 1
      - id: fineDustHealthConcern
        version: 1
      - id: dustSensor
        version: 1
      - id: dustHealthConcern
        version: 1
      - id: airQualityHealthConcern
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: AirQualityDetector
preferences:
  - name: pollInterval
    title: Poll interval
    description: Poll interval in seconds. AirLink updates once per minute; values below 60 are intentionally not allowed.
    required: true
    preferenceType: integer
    definition:
      minimum: 60
      maximum: 3600
      default: 60
  - name: healthBasis
    title: Health concern basis
    description: Choose which AirLink PM values should be used for SmartThings health concern categories.
    required: true
    preferenceType: enumeration
    definition:
      options:
        nowcast: NowCast preferred
        minute: One-minute average
      default: nowcast
  - name: hostOverride
    title: Static host or IP override
    description: Optional fallback hostname or IP address for an already-created AirLink device. Leave empty to use mDNS-discovered address.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: debugLogging
    title: Debug logging
    description: Enable compact poll diagnostics in driver logs. Leave off for normal use.
    required: false
    preferenceType: boolean
    definition:
      default: false
