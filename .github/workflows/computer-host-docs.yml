name: Computer Host LAN documentation links
on:
  push:
    paths:
      - 'computer-host-lan/**'
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/computer-host-lan-bug.md'
      - '.github/computer-host-lan-docs/**'
      - '.github/scripts/*computer_host_docs.py'
      - '.github/workflows/computer-host-docs.yml'
  pull_request:
    paths:
      - 'computer-host-lan/**'
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/computer-host-lan-bug.md'
      - '.github/computer-host-lan-docs/**'
      - '.github/scripts/*computer_host_docs.py'
      - '.github/workflows/computer-host-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install documentation-check-only parser
        run: python -m pip install markdown-it-py==4.0.0 mdurl==0.1.2
      - name: Link checker regression tests
        run: python -m unittest discover -s .github/scripts -p test_check_computer_host_docs.py -v
      - name: Check tracked Markdown paths and anchors
        # Temporary pre-cleanup baseline. Remove --baseline when migration
        # is complete; it is deliberately not the moving PR base.
        run: python .github/scripts/check_computer_host_docs.py --baseline 88752d571e71ec4ce111a07408fa7440ebbbb304
