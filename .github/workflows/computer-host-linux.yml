name: Computer Host Linux reference verification
on:
  push:
    paths:
      - 'computer-host-lan/**'
      - '.github/workflows/computer-host-linux.yml'
  pull_request:
    paths:
      - 'computer-host-lan/**'
      - '.github/workflows/computer-host-linux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: computer-host-lan
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test-only requirements
        run: python -m pip install -r requirements-test.txt
      - name: Unit and loopback HTTP regression tests
        run: |
          python -m unittest discover -s tests -q
          python scripts/ci/smoke_agent.py
      - name: Validate shell scripts
        run: |
          for s in scripts/*.sh scripts/ci/*.sh; do sh -n "$s"; done
      - name: Validate systemd units
        run: systemd-analyze verify agent/systemd/linux-host-agent.service agent/systemd/linux-host-agent-power.service agent/systemd/linux-host-agent-power.socket

  distro-source-smoke:
    defaults:
      run:
        working-directory: computer-host-lan
    # These container jobs do NOT run systemd as PID 1 or exercise hardware power.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-12
            image: debian:12
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-yaml systemd passwd coreutils util-linux
          - name: debian-13
            image: debian:13
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-yaml systemd passwd coreutils util-linux
          - name: ubuntu-24.04
            image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-yaml systemd passwd coreutils util-linux
          - name: ubuntu-26.04
            image: ubuntu:26.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-yaml systemd passwd coreutils util-linux
          - name: fedora-43
            image: fedora:43
            install: dnf install -y python3 python3-pyyaml systemd shadow-utils coreutils util-linux
          - name: fedora-44
            image: fedora:44
            install: dnf install -y python3 python3-pyyaml systemd shadow-utils coreutils util-linux
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build-time prerequisites
        run: ${{ matrix.install }}
      - name: Unit tests, installer preview, loopback smoke
        run: ./scripts/ci/run-container-tests.sh

  source-release-smoke:
    name: Reproducible source archives and checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release candidate source and docs archives
        working-directory: computer-host-lan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/build_release.py --output-dir "$RUNNER_TEMP/computer-host-package"
          cd "$RUNNER_TEMP/computer-host-package"
          sha256sum -c *-SHA256SUMS.txt
      - name: Retain source candidate as CI evidence (not a public release)
        uses: actions/upload-artifact@v7
        with:
          name: computer-host-lan-source-candidate
          path: ${{ runner.temp }}/computer-host-package/
          if-no-files-found: error
          retention-days: 7
