name: Computer Host Linux reference verification
concurrency:
  group: computer-host-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - 'computer-host-lan/**'
      - '.github/workflows/computer-host-linux.yml'
  pull_request:
    paths:
      - 'computer-host-lan/**'
      - '.github/workflows/computer-host-linux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      COMPUTER_HOST_REQUIRE_LUA: '1'
    defaults:
      run:
        working-directory: computer-host-lan
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Lua runtime for mandatory Edge tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblua5.4-0
      - name: Install test-only requirements
        run: python -m pip install -r requirements-test.txt
      - name: Unit and loopback HTTP regression tests
        run: |
          python -m unittest discover -s tests -q
          python scripts/ci/smoke_agent.py
      # Required, test-only upstream runtime coverage, separate from the
      # deterministic Lua suite. Do not ship these dependencies in any kit.
      - name: Fetch pinned upstream cosock for native transport integration
        if: matrix.python == '3.12'
        uses: actions/checkout@v7
        with:
          repository: cosock/cosock
          ref: 204ae4e37233e2b2410b5979dc6e39fe50411e4f
          path: .ci-cosock
          persist-credentials: false
      - name: Real cosock and LuaSocket HTTP deadline integration
        if: matrix.python == '3.12'
        timeout-minutes: 3
        run: |
          set -eu
          sudo apt-get install -y --no-install-recommends lua5.4 lua-socket lua-sec
          test "$(git -C ../.ci-cosock rev-parse HEAD)" = 204ae4e37233e2b2410b5979dc6e39fe50411e4f
          lua5.4 -e 'print(_VERSION,require("socket")._VERSION)'
          python scripts/ci/test_edge_http_runtime.py --cosock-dir ../.ci-cosock
      - name: Real NetworkManager WOL property round-trip (isolated Ubuntu container)
        if: matrix.python == '3.12'
        timeout-minutes: 5
        run: |
          docker run --rm --cap-add=NET_ADMIN \
            --env COMPUTER_HOST_NMCLI_CONTAINER=1 \
            --volume "$PWD:/project:ro" ubuntu:24.04 /bin/sh -ec '
              export DEBIAN_FRONTEND=noninteractive
              printf "#!/bin/sh\nexit 101\n" > /usr/sbin/policy-rc.d
              chmod 755 /usr/sbin/policy-rc.d
              apt-get update
              apt-get install -y --no-install-recommends network-manager dbus python3
              mkdir -p /run/dbus /etc/NetworkManager
              printf "[main]\nplugins=keyfile\n[keyfile]\nunmanaged-devices=*\n" > /tmp/computer-host-nm.conf
              dbus-daemon --system --fork --nopidfile
              NetworkManager --no-daemon --config=/tmp/computer-host-nm.conf > /tmp/nm.log 2>&1 &
              if ! python3 -B /project/scripts/ci/smoke_nmcli_wol.py; then
                cat /tmp/nm.log >&2
                exit 1
              fi
            '
      - name: Validate shell scripts
        run: |
          for s in scripts/*.sh scripts/ci/*.sh; do sh -n "$s"; done
      - name: Validate systemd units
        run: systemd-analyze verify agent/systemd/linux-host-agent.service agent/systemd/linux-host-agent-power.service agent/systemd/linux-host-agent-power.socket

  distro-source-smoke:
    defaults:
      run:
        working-directory: computer-host-lan
    # These container jobs do NOT run systemd as PID 1 or exercise hardware power.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-12
            image: debian:12
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-yaml systemd passwd coreutils util-linux liblua5.4-0
          - name: debian-13
            image: debian:13
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-yaml systemd passwd coreutils util-linux liblua5.4-0
          - name: ubuntu-24.04
            image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-yaml systemd passwd coreutils util-linux liblua5.4-0
          - name: ubuntu-26.04
            image: ubuntu:26.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-yaml systemd passwd coreutils util-linux liblua5.4-0
          - name: fedora-43
            image: fedora:43
            install: dnf install -y python3 python3-pyyaml systemd shadow-utils coreutils util-linux lua-libs
          - name: fedora-44
            image: fedora:44
            install: dnf install -y python3 python3-pyyaml systemd shadow-utils coreutils util-linux lua-libs
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build-time prerequisites
        run: ${{ matrix.install }}
      - name: Unit tests, installer preview, loopback smoke
        run: ./scripts/ci/run-container-tests.sh

  source-release-smoke:
    name: Reproducible source archives and checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release candidate source and docs archives
        working-directory: computer-host-lan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/build_release.py --output-dir "$RUNNER_TEMP/computer-host-package"
          cd "$RUNNER_TEMP/computer-host-package"
          sha256sum -c *-SHA256SUMS.txt
      - name: Retain source candidate as CI evidence (not a public release)
        uses: actions/upload-artifact@v7
        with:
          name: computer-host-lan-source-candidate
          path: ${{ runner.temp }}/computer-host-package/
          if-no-files-found: error
          retention-days: 7
