name: Computer Host Windows agent (build, power-contract tests and smoke)
concurrency:
  group: computer-host-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - 'computer-host-lan/windows-agent/**'
      - '.github/workflows/computer-host-windows.yml'
  pull_request:
    paths:
      - 'computer-host-lan/windows-agent/**'
      - '.github/workflows/computer-host-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: computer-host-lan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build (warnings are errors)
        run: dotnet build windows-agent/ComputerHost.WindowsAgent/ComputerHost.WindowsAgent.csproj -c Release
      - name: Contract and Win32 telemetry tests
        run: dotnet run --project windows-agent/ComputerHost.WindowsAgent.Tests/ComputerHost.WindowsAgent.Tests.csproj -c Release
      - name: Publish self-contained Windows x64 executable
        shell: pwsh
        run: ./windows-agent/scripts/Publish-WindowsAgent.ps1 -Runtime win-x64
      - name: HTTP smoke on Windows runner (not a real SmartThings LAN)
        shell: pwsh
        run: ./windows-agent/scripts/Smoke-WindowsAgent.ps1 -Executable "${{ github.workspace }}/computer-host-lan/windows-agent/publish/win-x64/ComputerHost.WindowsAgent.exe"
      - name: Archive unsigned development executable
        uses: actions/upload-artifact@v7
        with:
          name: computer-host-windows-unsigned-dev-win-x64
          path: computer-host-lan/windows-agent/publish/win-x64/
          if-no-files-found: error
          retention-days: 7
      - name: Install as LocalService and verify service monitoring (no power command)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = Join-Path (Get-Location) 'windows-agent'
          $publish = Join-Path $agent 'publish/win-x64'
          $install = Join-Path $agent 'scripts/Install-WindowsAgent.ps1'
          $uninstall = Join-Path $agent 'scripts/Uninstall-WindowsAgent.ps1'
          $state = Join-Path $env:ProgramData 'ComputerHostAgent'
          $attackerName = 'chlan-ci-standard'
          $attackerAccount = '{0}\{1}' -f $env:COMPUTERNAME, $attackerName
          try {
            # Create a real unprivileged local account for the ownership attack.
            $attackerPassword = ConvertTo-SecureString 'Chlan-CI-only!2026' -AsPlainText -Force
            New-LocalUser -Name $attackerName -Password $attackerPassword -PasswordNeverExpires -AccountNeverExpires -UserMayNotChangePassword | Out-Null
            $attackerSid = (Get-LocalUser -Name $attackerName).SID.Value
            $standardUserSids = @(Get-LocalGroupMember -SID 'S-1-5-32-545' | ForEach-Object { $_.SID.Value })
            if ($standardUserSids -notcontains $attackerSid) {
              Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $attackerName
              $standardUserSids = @(Get-LocalGroupMember -SID 'S-1-5-32-545' | ForEach-Object { $_.SID.Value })
            }
            if ($standardUserSids -notcontains $attackerSid) {
              throw 'CI attacker account could not be added to the standard Users group'
            }

            # Scenario 1: a standard user owns the directory and the planted key.
            if (Test-Path -LiteralPath $state) { throw 'Unexpected pre-existing state on clean CI runner' }
            New-Item -ItemType Directory -Path $state | Out-Null
            $plantedToken = Join-Path $state 'control-token'
            [IO.File]::WriteAllText($plantedToken, (('a' * 64) + [Environment]::NewLine), [Text.Encoding]::ASCII)
            $ownerFixtureAcl = Get-Acl -LiteralPath $state
            $ownerFixtureAcl.SetAccessRuleProtection($true, $false)
            foreach ($sid in @('S-1-5-18','S-1-5-32-544',$attackerSid)) {
              $ownerFixtureAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
                [Security.Principal.SecurityIdentifier]::new($sid),
                'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow'))
            }
            Set-Acl -LiteralPath $state -AclObject $ownerFixtureAcl
            & icacls.exe $state /setowner $attackerAccount /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Unable to assign the CI standard user as state owner' }
            $stateOwner = (Get-Acl -LiteralPath $state).GetOwner([Security.Principal.SecurityIdentifier]).Value
            $tokenOwner = (Get-Acl -LiteralPath $plantedToken).GetOwner([Security.Principal.SecurityIdentifier]).Value
            if ($stateOwner -ne $attackerSid -or $tokenOwner -ne $attackerSid) {
              throw 'CI fixture did not create an attacker-owned directory and control-token'
            }
            $ownerTestOutput = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $install -PublishedDirectory $publish -SkipFirewall -EnablePower 2>&1
            $ownerTestExitCode = $LASTEXITCODE
            if ($ownerTestExitCode -eq 0) { throw 'Installer accepted standard-user-owned ProgramData state' }
            if (($ownerTestOutput | Out-String) -notmatch 'untrusted owner') {
              throw 'Installer refused attacker-owned state for an unexpected reason'
            }
            if ((Get-Content -LiteralPath $plantedToken -Raw).Trim() -cne ('a' * 64)) {
              throw 'Installer changed an attacker-owned planted key before refusing state'
            }
            if (Get-Service ComputerHostAgent -ErrorAction SilentlyContinue) {
              throw 'Installer registered a service before refusing attacker-owned state'
            }
            & icacls.exe $state /setowner '*S-1-5-32-544' /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Unable to restore CI state fixture ownership' }
            & icacls.exe $state /grant '*S-1-5-32-544:(OI)(CI)F' /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Unable to restore CI state fixture permissions' }
            Remove-Item -LiteralPath $state -Force -Recurse -ErrorAction Stop
            Write-Host 'PASS refused a standard-user-owned directory and planted token without reading or changing the key'

            # Scenario 2: even an administrator-owned folder is refused when
            # its DACL grants BUILTIN Users access to the retained control-token.
            New-Item -ItemType Directory -Path $state | Out-Null
            $plantedToken = Join-Path $state 'control-token'
            [IO.File]::WriteAllText($plantedToken, (('b' * 64) + [Environment]::NewLine), [Text.Encoding]::ASCII)
            $weakAcl = Get-Acl -LiteralPath $state
            $weakAcl.SetAccessRuleProtection($true, $false)
            foreach ($sid in @('S-1-5-18','S-1-5-32-544','S-1-5-32-545')) {
              $weakAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
                [Security.Principal.SecurityIdentifier]::new($sid),
                'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow'))
            }
            Set-Acl -LiteralPath $state -AclObject $weakAcl
            $aceTestOutput = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $install -PublishedDirectory $publish -SkipFirewall -EnablePower 2>&1
            $aceTestExitCode = $LASTEXITCODE
            if ($aceTestExitCode -eq 0) { throw 'Installer accepted administrator-owned state with a Users FullControl ACE' }
            if (($aceTestOutput | Out-String) -notmatch 'untrusted principal') {
              throw 'Installer refused permissive state for an unexpected reason'
            }
            if ((Get-Content -LiteralPath $plantedToken -Raw).Trim() -cne ('b' * 64)) {
              throw 'Installer changed a key in a state directory with a permissive DACL'
            }
            Remove-Item -LiteralPath $state -Force -Recurse -ErrorAction Stop
            Write-Host 'PASS refused administrator-owned state with an untrusted Users access rule'

            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $install -PublishedDirectory $publish -SkipFirewall
            if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 monitoring install failed' }
            $svc = Get-CimInstance Win32_Service -Filter "Name='ComputerHostAgent'"
            if ($svc.StartName -ne 'NT AUTHORITY\LocalService' -or $svc.State -ne 'Running') {
              throw "Unexpected service account/state: $($svc.StartName) / $($svc.State)"
            }
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $info = Invoke-RestMethod 'http://127.0.0.1:8765/v2/info' -TimeoutSec 2
                if ($info.platform -eq 'windows' -and @($info.power_actions).Count -eq 0) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'LocalService Windows Service did not provide monitoring endpoint' }
            $permissions = Get-Acl -LiteralPath $state
            if (-not $permissions.AreAccessRulesProtected) { throw 'State directory ACL is not protected' }
            $admins = 'S-1-5-32-544'
            $serviceSidOutput = (& sc.exe showsid ComputerHostAgent 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'Unable to calculate service SID in CI' }
            $serviceSidMatch = [regex]::Match($serviceSidOutput, 'S-1-5-80-(?:\d+-){4}\d+')
            if (-not $serviceSidMatch.Success) { throw 'Service SID was not returned in CI' }
            $serviceSid = $serviceSidMatch.Value
            if ($serviceSid -ne 'S-1-5-80-3087533459-2037897677-1353449284-3397642928-3366244619') {
              throw 'Windows service SID differs from runtime policy'
            }
            $expectedDirectorySids = @($admins,'S-1-5-18',$serviceSid)
            foreach ($rule in $permissions.Access) {
              if ($rule.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow) { continue }
              $subject = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
              if ($expectedDirectorySids -notcontains $subject) {
                throw "State directory has unexpected allow ACE: $subject"
              }
            }
            if ($permissions.GetOwner([Security.Principal.SecurityIdentifier]).Value -ne $admins) {
              throw 'State directory owner is not BUILTIN Administrators'
            }
            $identityPath = Join-Path $state 'installation-id'
            $installedId = (Get-Content -LiteralPath $identityPath -Raw).Trim()
            if ((Get-Acl -LiteralPath $identityPath).GetOwner([Security.Principal.SecurityIdentifier]).Value -ne $admins) {
              throw 'Persistent installation-id owner is not BUILTIN Administrators'
            }
            Write-Host 'PASS LocalService, HTTP monitoring, secure state ownership and default-disabled power'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $install -PublishedDirectory $publish -SkipFirewall -EnablePower
            if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 opt-in install failed' }
            $secretPath = Join-Path $state 'control-token'
            $secret = (Get-Content -LiteralPath $secretPath -Raw).Trim()
            if ($secret -cnotmatch '^[a-f0-9]{64}$') { throw 'Control token malformed' }
            $tokenAcl = Get-Acl -LiteralPath $secretPath
            if ($tokenAcl.GetOwner([Security.Principal.SecurityIdentifier]).Value -ne $admins) {
              throw 'Control-token owner is not BUILTIN Administrators'
            }
            if (-not $tokenAcl.AreAccessRulesProtected) { throw 'Control-token ACL is not protected' }
            $expectedTokenSids = @($admins,'S-1-5-18',$serviceSid)
            foreach ($rule in $tokenAcl.Access) {
              if ($rule.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow) { continue }
              $subject = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
              if ($expectedTokenSids -notcontains $subject) {
                throw "Control-token has unexpected allow ACE: $subject"
              }
            }
            $infoPower = Invoke-RestMethod 'http://127.0.0.1:8765/v2/info' -TimeoutSec 3
            # Windows Server service security policy may deny SeShutdownPrivilege.
            # Power must then fail closed without disabling HTTP monitoring.
            if (@($infoPower.power_actions).Count -notin @(0,3)) { throw 'Invalid power action set' }
            if (@($infoPower.power_actions).Count -eq 0) {
              Write-Host 'PASS Windows security policy refused privilege; power was not advertised'
            }
            # Run the degraded-credential checks under the actual installed
            # LocalService + service SID, not only under the console CI user.
            # Test-fixture comparison: ignore Windows' automatic SDDL control flags,
            # but retain protection and every explicit/inherited allow/deny rule.
            function Get-AccessRuleSnapshot($security) {
              $rules = @($security.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) |
                ForEach-Object {
                  '{0}:{1}:{2}:{3}:{4}:{5}' -f $_.IdentityReference.Value, $_.AccessControlType,
                    ([int]$_.FileSystemRights), $_.InheritanceFlags, $_.PropagationFlags, $_.IsInherited
                })
              [string[]]$sorted = $rules
              [Array]::Sort($sorted, [StringComparer]::Ordinal)
              $protection = if ($security.AreAccessRulesProtected) { 'P|' } else { '|' }
              return ($protection + ($sorted -join ';'))
            }
            function Assert-DegradedServicePower {
              Start-Service ComputerHostAgent
              $checked = $false
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                try {
                  $observed = Invoke-RestMethod 'http://127.0.0.1:8765/v2/info' -TimeoutSec 2
                  $health = Invoke-RestMethod 'http://127.0.0.1:8765/v2/health' -TimeoutSec 2
                  $metrics = Invoke-RestMethod 'http://127.0.0.1:8765/v2/metrics' -TimeoutSec 2
                } catch { Start-Sleep -Milliseconds 500; continue }
                if ($observed.id -ne $installedId -or $health.id -ne $installedId -or
                    $metrics.id -ne $installedId -or @($observed.power_actions).Count -ne 0) {
                  throw 'Unsafe power credential changed identity or enabled power'
                }
                $checked = $true
                break
              }
              if (-not $checked) { throw 'Degraded power configuration stopped monitoring' }
              try {
                Invoke-WebRequest 'http://127.0.0.1:8765/v2/challenge' -TimeoutSec 3 -ErrorAction Stop | Out-Null
                throw 'Degraded power configuration allowed challenge'
              } catch { if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw } }
            }
            Stop-Service ComputerHostAgent
            $savedToken = Join-Path $state 'control-token.ci-saved'
            Move-Item -LiteralPath $secretPath -Destination $savedToken
            try {
              Assert-DegradedServicePower
              if (Test-Path -LiteralPath $secretPath) { throw 'Service generated missing control-token' }
            } finally {
              Stop-Service ComputerHostAgent -ErrorAction SilentlyContinue
              Move-Item -LiteralPath $savedToken -Destination $secretPath
            }
            # The token is synthetic CI state only. Restore its original DACL
            # before the next installer operation, even if the test fails.
            $unsafeTokenAcl = Get-Acl -LiteralPath $secretPath
            $everyone = [Security.Principal.SecurityIdentifier]::new('S-1-1-0')
            $originalTokenDacl = Get-AccessRuleSnapshot $unsafeTokenAcl
            $injectedTokenRule = [Security.AccessControl.FileSystemAccessRule]::new($everyone, 'Read', 'Allow')
            $unsafeTokenAcl.AddAccessRule($injectedTokenRule)
            Set-Acl -LiteralPath $secretPath -AclObject $unsafeTokenAcl
            try { Assert-DegradedServicePower }
            finally {
              Stop-Service ComputerHostAgent -ErrorAction SilentlyContinue
              $unsafeTokenAcl.RemoveAccessRuleSpecific($injectedTokenRule)
              Set-Acl -LiteralPath $secretPath -AclObject $unsafeTokenAcl
              $restoredTokenDacl = Get-AccessRuleSnapshot (Get-Acl -LiteralPath $secretPath)
              if ($restoredTokenDacl -cne $originalTokenDacl) {
                throw "Service test did not restore original token DACL.`nExpected: $originalTokenDacl`nObserved: $restoredTokenDacl"
              }
            }
            if ((Get-Content -LiteralPath $secretPath -Raw).Trim() -cne $secret) { throw 'Service changed unsafe token' }
            Start-Service ComputerHostAgent
            Write-Host 'PASS LocalService monitoring remains active with missing or unsafe power credential'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $install -PublishedDirectory $publish -SkipFirewall
            if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 power-disable upgrade failed' }
            $infoOff = Invoke-RestMethod 'http://127.0.0.1:8765/v2/info' -TimeoutSec 3
            if (@($infoOff.power_actions).Count -ne 0) { throw 'Power remained enabled after opt-out' }
            if ((Get-Content -LiteralPath $secretPath -Raw).Trim() -cne $secret -or
                (Get-Content -LiteralPath $identityPath -Raw).Trim() -cne $installedId) {
              throw 'Power opt-out upgrade changed the existing key or installation identity'
            }
            # Reuse the legacy ZIP/PowerShell path to verify custom settings survive
            # an upgrade, and the firewall listens on the actual configured port.
            $appConfig = Join-Path $env:ProgramFiles 'Computer Host Agent/appsettings.json'
            $config = Get-Content -LiteralPath $appConfig -Raw | ConvertFrom-Json
            $config.HostAgent.Port = 18766
            $config.HostAgent.DiscoveryEnabled = $false
            $config | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $appConfig -Encoding utf8
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $install -PublishedDirectory $publish -HubIPv4 '192.0.2.20'
            if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell custom-port upgrade failed' }
            $kept = Get-Content -LiteralPath $appConfig -Raw | ConvertFrom-Json
            if ($kept.HostAgent.Port -ne 18766 -or $kept.HostAgent.DiscoveryEnabled -ne $false) {
              throw 'PowerShell upgrade lost custom configuration'
            }
            $ports = @((Get-NetFirewallRule -Name 'ComputerHostAgent-TCP8765' | Get-NetFirewallPortFilter).LocalPort)
            if ($ports -notcontains '18766') { throw 'Firewall did not follow configured HTTP port' }
            $customInfo = Invoke-RestMethod http://127.0.0.1:18766/v2/info -TimeoutSec 3
            if ($customInfo.platform -ne 'windows') { throw 'Custom-port HTTP agent unavailable' }
            if ((Get-Content -LiteralPath $secretPath -Raw).Trim() -cne $secret -or
                (Get-Content -LiteralPath $identityPath -Raw).Trim() -cne $installedId) {
              throw 'Custom-port upgrade changed the existing key or installation identity'
            }
            $tokenAcl = Get-Acl -LiteralPath $secretPath
            if (-not $tokenAcl.AreAccessRulesProtected -or @($tokenAcl.Access).Count -lt 3) {
              throw 'Existing authentication-token ACL was not restricted on upgrade'
            }
            foreach ($rule in $tokenAcl.Access) {
              if ($rule.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow) { continue }
              $subject = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
              if ($expectedTokenSids -notcontains $subject) {
                throw "Upgraded control-token has unexpected allow ACE: $subject"
              }
            }
            Write-Host 'PASS Windows PowerShell config preservation, custom-port firewall and token ACL'

            # The uninstaller deliberately retains ProgramData for reinstallation.
            # A stricter owner/DACL preflight must not reject that legitimate state
            # after the original Windows service is no longer registered.
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $uninstall -KeepProgramFiles
            if ($LASTEXITCODE -ne 0) { throw 'State-preserving uninstall failed' }
            $removed = $false
            for ($i = 0; $i -lt 40; $i++) {
              if (-not (Get-CimInstance Win32_Service -Filter "Name='ComputerHostAgent'")) {
                $removed = $true
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $removed) { throw 'Service remained registered after uninstall' }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $install -PublishedDirectory $publish -SkipFirewall -EnablePower
            if ($LASTEXITCODE -ne 0) { throw 'Retained-state reinstallation failed' }
            if ((Get-Content -LiteralPath $secretPath -Raw).Trim() -cne $secret -or
                (Get-Content -LiteralPath $identityPath -Raw).Trim() -cne $installedId) {
              throw 'Retained-state reinstallation changed the key or installation ID'
            }
            $again = Invoke-RestMethod http://127.0.0.1:18766/v2/info -TimeoutSec 3
            if ($again.id -cne $installedId) { throw 'Reinstalled agent reported different UUID' }
            if ((Get-Acl -LiteralPath $state).GetOwner([Security.Principal.SecurityIdentifier]).Value -ne $admins) {
              throw 'Reinstalled state directory owner changed unexpectedly'
            }
            Write-Host 'PASS retained-state reinstall without key rotation, UUID change or service mismatch'

            # Exercise the PowerShell 7 / .NET ACL-aware creation path separately.
            # Purge only this disposable CI installation, retaining Program Files.
            & $uninstall -PurgeState -KeepProgramFiles
            if (-not $?) { throw 'PowerShell 7 pre-test cleanup failed' }
            & $install -PublishedDirectory $publish -SkipFirewall
            if (-not $?) { throw 'PowerShell 7 fresh install using ACL-aware Directory.Create failed' }
            $ps7Info = $null
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $ps7Info = Invoke-RestMethod http://127.0.0.1:18766/v2/info -TimeoutSec 2
                if ($ps7Info.platform -eq 'windows') { break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ps7Info -or $ps7Info.platform -ne 'windows') {
              throw 'PowerShell 7 fresh installation did not start its monitoring service'
            }
            $ps7Id = $ps7Info.id
            $ps7DirectoryAcl = Get-Acl -LiteralPath $state
            if (-not $ps7DirectoryAcl.AreAccessRulesProtected -or
                $ps7DirectoryAcl.GetOwner([Security.Principal.SecurityIdentifier]).Value -ne $admins) {
              throw 'PowerShell 7 fresh state directory owner or DACL is incorrect'
            }
            foreach ($rule in $ps7DirectoryAcl.Access) {
              if ($rule.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow) { continue }
              $subject = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
              if ($expectedDirectorySids -notcontains $subject) {
                throw "PowerShell 7 state directory has unexpected allow ACE: $subject"
              }
            }
            & $install -PublishedDirectory $publish -SkipFirewall -EnablePower
            if (-not $?) { throw 'PowerShell 7 power opt-in upgrade failed' }
            $ps7EnabledInfo = Invoke-RestMethod http://127.0.0.1:18766/v2/info -TimeoutSec 3
            if ($ps7EnabledInfo.id -cne $ps7Id) { throw 'PowerShell 7 upgrade changed the installation UUID' }
            $ps7TokenPath = Join-Path $state 'control-token'
            $ps7Token = (Get-Content -LiteralPath $ps7TokenPath -Raw).Trim()
            if ($ps7Token -cnotmatch '^[a-f0-9]{64}$') { throw 'PowerShell 7 control-token malformed' }
            $ps7TokenAcl = Get-Acl -LiteralPath $ps7TokenPath
            if (-not $ps7TokenAcl.AreAccessRulesProtected -or
                $ps7TokenAcl.GetOwner([Security.Principal.SecurityIdentifier]).Value -ne $admins) {
              throw 'PowerShell 7 control-token owner or DACL is incorrect'
            }
            foreach ($rule in $ps7TokenAcl.Access) {
              if ($rule.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow) { continue }
              $subject = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
              if ($expectedTokenSids -notcontains $subject) {
                throw "PowerShell 7 control-token has unexpected allow ACE: $subject"
              }
            }
            Write-Host 'PASS PowerShell 7 fresh ACL-aware state creation and token lockdown'
            Write-Host 'PASS Windows PowerShell 5.1 and PowerShell 7 install, upgrade and retained-state coverage'
          } finally {
            if (Test-Path -LiteralPath $state) {
              & icacls.exe $state /setowner '*S-1-5-32-544' /T /C | Out-Null
              & icacls.exe $state /grant '*S-1-5-32-544:(OI)(CI)F' /T /C | Out-Null
            }
            & $uninstall -PurgeState
            if (Get-LocalUser -Name $attackerName -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name $attackerName
            }
          }
  windows-arm64-build:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: computer-host-lan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Cross-publish arm64 package (not executed)
        shell: pwsh
        run: ./windows-agent/scripts/Publish-WindowsAgent.ps1 -Runtime win-arm64
      - name: Archive unsigned development arm64 executable
        uses: actions/upload-artifact@v7
        with:
          name: computer-host-windows-unsigned-dev-win-arm64
          path: computer-host-lan/windows-agent/publish/win-arm64/
          if-no-files-found: error
          retention-days: 7
