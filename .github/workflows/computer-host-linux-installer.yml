name: Computer Host LAN Linux installer integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'computer-host-lan/linux-installer/**'
      - '.github/workflows/computer-host-linux-installer.yml'
      - 'computer-host-lan/scripts/**'
      - 'computer-host-lan/agent/**'

permissions:
  contents: read

jobs:
  wizard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: computer-host-lan/linux-installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Enforce gofmt source formatting
        run: |
          unformatted="$(gofmt -l ./*.go)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go sources:"
            printf '%s\n' "$unformatted"
            gofmt -d ./*.go
            exit 1
          fi
      - name: Ensure module files are tidy and unchanged
        run: go mod tidy -diff
      - name: Verify cached module checksums
        run: go mod verify
      - name: Test authenticated release gate (no signing or publication)
        run: |
          cd ../scripts/ci
          python3 -B -m unittest -v test_attested_release_gate
      - name: Test embedded bundle generator
        run: python3 -B -m unittest -v test_sync_bundle
      - name: Check generated embedded bundle is current
        run: python3 -B sync_bundle.py --check
      - name: Verify embedded privileged payload matches authoritative source
        run: go test -run 'TestEmbedded' ./...
      - name: Unit tests
        run: go test ./...
      - name: Installed root helper status smoke (isolated runner, read-only)
        run: |
          set -eu
          # Compile without root. This disposable runner gets only the
          # root-owned helper bundle; no managed agent files are touched.
          go test -c -o "$RUNNER_TEMP/computer-host-root-status.test" .
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root \
            LANG=C LC_ALL=C GITHUB_ACTIONS=true \
            COMPUTER_HOST_CI_ROOT_SMOKE=1 \
            "$RUNNER_TEMP/computer-host-root-status.test" \
            -test.run '^TestRootInstalledHelperStatusSmoke$' -test.v
      - name: Race detector (Review DescriptionFunc vs Validate)
        run: go test -race ./...
      - name: Static checks
        run: go vet ./...
      - name: Build and non-interactive smoke test
        run: |
          go build -o "$RUNNER_TEMP/computer-host-linux-tui-demo" .
          "$RUNNER_TEMP/computer-host-linux-tui-demo" -preview > "$RUNNER_TEMP/tui-preview.txt"
          grep -q 'DEMO ONLY — NO CHANGES WILL BE MADE' "$RUNNER_TEMP/tui-preview.txt"
          grep -q 'Power management: false' "$RUNNER_TEMP/tui-preview.txt"
          grep -q 'Persistent Wake-on-LAN: false' "$RUNNER_TEMP/tui-preview.txt"
          python3 pty_smoke.py "$RUNNER_TEMP/computer-host-linux-tui-demo"
          printf '1\n4\nk\nk\ny\n' | NO_COLOR=1 TERM=dumb "$RUNNER_TEMP/computer-host-linux-tui-demo" -demo -accessible > "$RUNNER_TEMP/accessibility.txt"
          grep -q 'DEMO COMPLETE' "$RUNNER_TEMP/accessibility.txt"
          if python3 -c 'import sys; sys.exit(b"\x1b" not in open(sys.argv[1], "rb").read())' "$RUNNER_TEMP/accessibility.txt"; then
            echo 'Accessible output contains ANSI escape bytes' >&2
            exit 1
          fi
      - name: Noninteractive CLI grammar and JSON smoke test (no elevation)
        run: |
          python3 - "$RUNNER_TEMP/computer-host-linux-tui-demo" <<'PY'
          import json
          import subprocess
          import sys

          binary = sys.argv[1]

          def run(*args):
              return subprocess.run([binary, *args], stdin=subprocess.DEVNULL,
                                    capture_output=True, text=True, timeout=10)

          help_result = run("cli", "--help")
          assert help_result.returncode == 0, help_result
          assert "--confirm INSTALL" in help_result.stdout, help_result
          for args in (
              (),
              ("install",),
              ("upgrade", "--confirm", "INSTALL"),
              ("repair", "--confirm", "REPAIR", "--elevation", "su"),
              ("uninstall", "--confirm", "UNINSTALL", "--power", "enable"),
              ("status", "--request", "{}"),
              ("plan",),
              ("plan", "--action", "uninstall"),
              ("plan", "--action", "install", "--confirm", "INSTALL"),
              ("plan", "--action", "upgrade", "--elevation", "auto"),
              ("recover", "--confirm", "RECOVER", "--confirm", "RECOVER"),
              ("install", "--confirm", "INSTALL", "--source", "/tmp/fixture"),
          ):
              result = run("cli", *args)
              assert result.returncode == 2, result
              data = json.loads(result.stdout)
              assert data["schema_version"] == 1, data
              assert data["status"] == "error", data
              assert data["error_code"] == "invalid_cli_arguments", data
              assert data["secrets_included"] is False, data
              assert not result.stderr, result
          # A CLI token cannot be appended to wizard or bootstrap flags.
          result = run("-preview", "cli", "status")
          assert result.returncode == 2, result
          PY
      - name: Real unprivileged read-only backend smoke test
        run: |
          set -eu
          "$RUNNER_TEMP/computer-host-linux-tui-demo" -live -preview \
            -api ../scripts/installer-api.sh \
            > "$RUNNER_TEMP/live-inspection.txt"
          grep -q 'REAL HOST — READ-ONLY INSPECTION' "$RUNNER_TEMP/live-inspection.txt"
          grep -q 'REAL READ-ONLY FILE PLAN' "$RUNNER_TEMP/live-inspection.txt"
          python3 pty_smoke.py "$RUNNER_TEMP/computer-host-linux-tui-demo" --live
          # Exercise the NIC-page keyboard path with a controlled fake API.
          python3 pty_live_nic.py "$RUNNER_TEMP/computer-host-linux-tui-demo"
          grep -q 'Privileged transaction/recovery status: UNKNOWN' "$RUNNER_TEMP/live-inspection.txt"
          printf 's\nk\nk\ny\n' | NO_COLOR=1 TERM=dumb \
            "$RUNNER_TEMP/computer-host-linux-tui-demo" -live -accessible \
            -api ../scripts/installer-api.sh \
            > "$RUNNER_TEMP/live-accessible.txt"
          grep -q 'SETUP PREVIEW COMPLETE' "$RUNNER_TEMP/live-accessible.txt"
          if python3 -c 'import sys; sys.exit(b"\x1b" not in open(sys.argv[1], "rb").read())' "$RUNNER_TEMP/live-accessible.txt"; then
            echo 'Live accessible output contains ANSI escape bytes' >&2
            exit 1
          fi
      - name: Default installer startup and cancellation (no elevation)
        run: |
          set -eu
          binary="$RUNNER_TEMP/computer-host-linux-tui-demo"
          python3 pty_smoke.py "$binary" --install
          printf 'quit\n' | NO_COLOR=1 TERM=dumb "$binary" -accessible > "$RUNNER_TEMP/install-cancel.txt"
          grep -q 'LINUX INSTALLATION (PLAIN TEXT)' "$RUNNER_TEMP/install-cancel.txt"
          grep -q 'No changes made' "$RUNNER_TEMP/install-cancel.txt"
          "$binary" -live -preview > "$RUNNER_TEMP/embedded-preview.txt"
          grep -q 'REAL HOST — READ-ONLY INSPECTION' "$RUNNER_TEMP/embedded-preview.txt"
          grep -q 'REAL READ-ONLY FILE PLAN' "$RUNNER_TEMP/embedded-preview.txt"
          python3 - "$binary" <<'PY'
          import subprocess
          import sys

          binary = sys.argv[1]
          for args in (
              ("-demo", "-live"),
              ("-demo", "-recover"),
              ("-demo", "-uninstall"),
              ("-demo", "-root-bootstrap"),
              ("-demo=false",),
              ("-live=false",),
              ("-install=false",),
              ("-preview=false",),
              ("-root-bootstrap=false",),
              ("-recover=false",),
              ("-uninstall=false",),
              ("-api", "/nonexistent"),
              ("-install",),
              ("-request", ""),
              ("-demo", "-elevation", "su"),
          ):
              result = subprocess.run([binary, *args], stdin=subprocess.DEVNULL,
                                      capture_output=True, text=True, timeout=10)
              assert result.returncode == 2, (args, result)
          # /dev/null is a character device but not a terminal. Check
          # both it and a pipe; refuse before inspecting or requesting consent.
          for args, message in (
              ((), "interactive installation needs a terminal"),
              (("-live", "-install"), "interactive installation needs a terminal"),
              (("-demo",), "interactive demo needs a terminal"),
              (("-live",), "interactive setup requires a terminal"),
              (("-live", "-api", "/nonexistent"), "interactive setup requires a terminal"),
              (("-uninstall",), "interactive uninstall needs a terminal"),
              (("-recover",), "interactive recovery needs a terminal"),
          ):
              for stdin in (subprocess.DEVNULL, subprocess.PIPE):
                  result = subprocess.run([binary, *args], stdin=stdin,
                                          capture_output=True, text=True, timeout=10)
                  assert result.returncode == 1, (args, stdin, result)
                  assert message in result.stderr, (args, stdin, result)
                  assert not result.stdout, (args, stdin, result)

          # Plain-text setup may accept a pipe or EOF without elevating.
          result = subprocess.run([binary, "-accessible"], stdin=subprocess.DEVNULL,
                                  capture_output=True, text=True, timeout=60)
          assert result.returncode == 0, result
          assert "Setup cancelled. No changes made." in result.stdout, result
          PY
      - name: Refuse conflicting installation or sudo in preview/test modes
        run: |
          set -eu
          if "$RUNNER_TEMP/computer-host-linux-tui-demo" -live -install -preview \
            -api ../scripts/installer-api.sh > "$RUNNER_TEMP/invalid-install.txt" 2>&1; then
            echo "Install accepted an ambiguous preview combination" >&2
            exit 1
          fi
          if "$RUNNER_TEMP/computer-host-linux-tui-demo" -root-bootstrap \
            </dev/null > "$RUNNER_TEMP/invalid-root.txt" 2>&1; then
            echo "Root helper ran unprivileged" >&2
            exit 1
          fi
          if "$RUNNER_TEMP/computer-host-linux-tui-demo" -live -preview \
            -elevation su -api ../scripts/installer-api.sh \
            > "$RUNNER_TEMP/invalid-preview-elevation.txt" 2>&1; then
            echo "Read-only preview accepted a privileged elevation override" >&2
            exit 1
          fi
          if "$RUNNER_TEMP/computer-host-linux-tui-demo" -preview \
            -elevation arbitrary > "$RUNNER_TEMP/invalid-method.txt" 2>&1; then
            echo "Unknown authorization method was accepted" >&2
            exit 1
          fi
      - name: Build static x86_64 test-only binary for Gentoo acceptance
        run: |
          set -eu
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "$RUNNER_TEMP/computer-host-linux-installer-test" .
          cd "$RUNNER_TEMP"
          sha256sum computer-host-linux-installer-test > computer-host-linux-installer-test.sha256
      - name: Upload test-only Linux integration binary (not a release)
        uses: actions/upload-artifact@v7
        with:
          name: computer-host-linux-wizard-integration-test-only
          path: |
            ${{ runner.temp }}/computer-host-linux-installer-test
            ${{ runner.temp }}/computer-host-linux-installer-test.sha256
          if-no-files-found: error
          retention-days: 7
