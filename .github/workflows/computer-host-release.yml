name: Computer Host LAN release candidate (unsigned, not published)
concurrency:
  group: computer-host-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - 'computer-host-lan/**'
      - '.github/workflows/computer-host-release.yml'
      - '.github/workflows/computer-host-inno.yml'
  pull_request:
    paths:
      - 'computer-host-lan/**'
      - '.github/workflows/computer-host-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build versioned Linux source and docs
        shell: bash
        working-directory: computer-host-lan
        run: |
          set -euo pipefail
          python3 scripts/ci/build_release.py --output-dir "$RUNNER_TEMP/computer-host-source"
          cd "$RUNNER_TEMP/computer-host-source"
          sha256sum -c *-SHA256SUMS.txt
      - name: Upload source and documentation candidates
        uses: actions/upload-artifact@v7
        with:
          name: computer-host-release-source
          path: ${{ runner.temp }}/computer-host-source/
          if-no-files-found: error
          retention-days: 7
  windows-x64:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: computer-host-lan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Windows contract telemetry and HMAC tests
        run: dotnet run --project windows-agent/ComputerHost.WindowsAgent.Tests/ComputerHost.WindowsAgent.Tests.csproj -c Release
      - name: Publish unsigned Windows x64 executable
        shell: pwsh
        run: ./windows-agent/scripts/Publish-WindowsAgent.ps1 -Runtime win-x64
      - name: Run safe HTTP smoke without sending power commands
        shell: pwsh
        run: ./windows-agent/scripts/Smoke-WindowsAgent.ps1 -Executable "${{ github.workspace }}/computer-host-lan/windows-agent/publish/win-x64/ComputerHost.WindowsAgent.exe"
      - name: Publish and self-test SmartThings hub discovery helper for Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish windows-agent/HubDiscovery/ComputerHost.HubDiscovery.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o windows-agent/publish/hub-discovery
          if ($LASTEXITCODE -ne 0) { throw 'Hub discovery helper publish failed' }
          & ./windows-agent/publish/hub-discovery/ComputerHost.HubDiscovery.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Hub discovery candidate self-tests failed' }
      - name: Install Inno Setup 7 for beta setup build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) { throw 'WinGet unavailable: cannot build Windows Setup.exe' }
          winget install -e --id JRSoftware.InnoSetup.7 --source winget --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 7 compiler installation failed' }
          $locations = @(
            (Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 7/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 7/ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7/ISCC.exe')
          )
          $iscc = $locations | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'Programs'),$env:ProgramFiles -Filter ISCC.exe -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*Inno Setup 7*' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'Inno Setup 7 compiler missing after installation' }
          "INNO_ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Compile version-matched unsigned beta Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          $iss = Get-Content windows-agent/installer/ComputerHostLAN.iss -Raw
          if (-not $iss.Contains('#define IntegrationVersion "' + $release.integration + '"')) {
            throw 'Inno Setup installer version differs from release.json'
          }
          Push-Location windows-agent/installer
          try {
            & $env:INNO_ISCC ComputerHostLAN.iss
            if ($LASTEXITCODE -ne 0) { throw 'ISCC compilation failed' }
          } finally { Pop-Location }
          $setupName = "computer-host-lan-v$($release.integration)-windows-x64-unsigned-setup.exe"
          $setup = Join-Path (Get-Location) "windows-agent/installer/output/$setupName"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Expected Setup.exe missing: $setupName" }
          $out = Join-Path $env:RUNNER_TEMP 'computer-host-windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath $setup -Destination (Join-Path $out $setupName)
          $hash = (Get-FileHash -LiteralPath (Join-Path $out $setupName) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $setupName" | Set-Content -LiteralPath (Join-Path $out "$setupName.sha256") -Encoding ascii
          Write-Host "PASS release-matched unsigned setup: $setupName, SHA256=$hash"
      - name: Build and verify Windows x64 kit and SHA-256 manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'computer-host-windows'
          $published = Join-Path (Get-Location) 'windows-agent/publish/win-x64'
          python scripts/ci/build_windows_kit.py --published-dir "$published" --output-dir "$out" --runtime win-x64 --source-commit "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'Windows kit packaging failed' }
          $zip = Get-ChildItem -LiteralPath $out -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No Windows ZIP was produced' }
          $sha = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Get-ChildItem -LiteralPath $out -File | Select-Object Name,Length | Format-Table
          $checksumFile = Get-Item -LiteralPath ($zip.FullName + '.sha256') -ErrorAction SilentlyContinue
          if (-not $checksumFile) { throw 'Packaging step did not produce an external .sha256 file' }
          $expected = (Get-Content -LiteralPath $checksumFile.FullName -Raw).Split(' ')[0].Trim()
          if ($sha -ne $expected) { throw 'Outer Windows ZIP checksum mismatch' }
          $unpack = Join-Path $env:RUNNER_TEMP 'computer-host-unpacked'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpack -Force
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $unpack 'scripts/Verify-Package.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 package verification failed' }
          if (-not (Test-Path (Join-Path $unpack 'docs/RELEASE-NOTES.md'))) { throw 'Release notes missing' }
          if (-not (Test-Path (Join-Path $unpack 'scripts/Collect-WindowsDiagnostics.ps1'))) { throw 'Diagnostics missing' }
          if (-not (Test-Path (Join-Path $unpack 'publish/win-x64/ComputerHost.WindowsAgent.exe'))) { throw 'Executable missing' }
          Write-Host 'PASS Windows x64 kit, internal checksums, unsigned binary and diagnostics'
      - name: Upload unsigned Windows test kit
        uses: actions/upload-artifact@v7
        with:
          name: computer-host-release-windows-x64
          path: ${{ runner.temp }}/computer-host-windows/
          if-no-files-found: error
          retention-days: 7
  assemble:
    name: Validate release asset set (no publication)
    needs: [linux-source, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download release candidate components
        uses: actions/download-artifact@v8
        with:
          pattern: computer-host-release-*
          path: ${{ runner.temp }}/computer-host-release/
          merge-multiple: true
      - name: Check source and Windows assets and write unified SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/computer-host-release"
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name '*setup.exe' | wc -l)" -eq 1
          sha256sum -c ./*.zip.sha256
          sha256sum -c ./*.exe.sha256
          sha256sum -c ./computer-host-lan-v*-SHA256SUMS.txt
          sha256sum -- *.zip *setup.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          printf '%s\n' \
            "Computer Host LAN unsigned development candidate" \
            "Commit: $GITHUB_SHA" \
            "Unsigned beta candidate, not a published GitHub release; channel remains unchanged." \
            "Windows Setup GUI passes separate native Windows CI; real Windows 11 hub/mDNS/WOL tests remain beta objectives." \
            > RELEASE-CANDIDATE-NOTICE.txt
          ls -lh *.zip *setup.exe SHA256SUMS.txt
      - name: Upload one complete unsigned beta-candidate set
        uses: actions/upload-artifact@v7
        with:
          name: computer-host-lan-complete-unsigned-beta-candidate
          path: ${{ runner.temp }}/computer-host-release/
          if-no-files-found: error
          retention-days: 7
