name: Computer Host LAN release candidate (unsigned, not published)
on:
  push:
    branches: [main]
    paths:
      - 'computer-host-lan/**'
      - '.github/workflows/computer-host-release.yml'
  pull_request:
    paths:
      - 'computer-host-lan/**'
      - '.github/workflows/computer-host-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build versioned Linux source and docs
        shell: bash
        working-directory: computer-host-lan
        run: |
          set -euo pipefail
          python3 scripts/ci/build_release.py --output-dir "$RUNNER_TEMP/computer-host-source"
          cd "$RUNNER_TEMP/computer-host-source"
          sha256sum -c *-SHA256SUMS.txt
      - name: Upload source and documentation candidates
        uses: actions/upload-artifact@v7
        with:
          name: computer-host-release-source
          path: ${{ runner.temp }}/computer-host-source/
          if-no-files-found: error
          retention-days: 7
  windows-x64:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: computer-host-lan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Windows contract telemetry and HMAC tests
        run: dotnet run --project windows-agent/ComputerHost.WindowsAgent.Tests/ComputerHost.WindowsAgent.Tests.csproj -c Release
      - name: Publish unsigned Windows x64 executable
        shell: pwsh
        run: ./windows-agent/scripts/Publish-WindowsAgent.ps1 -Runtime win-x64
      - name: Run safe HTTP smoke without sending power commands
        shell: pwsh
        run: ./windows-agent/scripts/Smoke-WindowsAgent.ps1 -Executable "${{ github.workspace }}/computer-host-lan/windows-agent/publish/win-x64/ComputerHost.WindowsAgent.exe"
      - name: Build and verify Windows x64 kit and SHA-256 manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'computer-host-windows'
          $published = Join-Path (Get-Location) 'windows-agent/publish/win-x64'
          python scripts/ci/build_windows_kit.py --published-dir "$published" --output-dir "$out" --runtime win-x64 --source-commit "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'Windows kit packaging failed' }
          $zip = Get-ChildItem -LiteralPath $out -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No Windows ZIP was produced' }
          $sha = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Get-ChildItem -LiteralPath $out -File | Select-Object Name,Length | Format-Table
          $checksumFile = Get-ChildItem -LiteralPath $out -File -Filter '*.sha256' | Select-Object -First 1
          if (-not $checksumFile) { throw 'Packaging step did not produce an external .sha256 file' }
          $expected = (Get-Content -LiteralPath $checksumFile.FullName -Raw).Split(' ')[0].Trim()
          if ($sha -ne $expected) { throw 'Outer Windows ZIP checksum mismatch' }
          $unpack = Join-Path $env:RUNNER_TEMP 'computer-host-unpacked'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpack -Force
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $unpack 'scripts/Verify-Package.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 package verification failed' }
          if (-not (Test-Path (Join-Path $unpack 'docs/RELEASE-NOTES.md'))) { throw 'Release notes missing' }
          if (-not (Test-Path (Join-Path $unpack 'scripts/Collect-WindowsDiagnostics.ps1'))) { throw 'Diagnostics missing' }
          if (-not (Test-Path (Join-Path $unpack 'publish/win-x64/ComputerHost.WindowsAgent.exe'))) { throw 'Executable missing' }
          Write-Host 'PASS Windows x64 kit, internal checksums, unsigned binary and diagnostics'
      - name: Upload unsigned Windows test kit
        uses: actions/upload-artifact@v7
        with:
          name: computer-host-release-windows-x64
          path: ${{ runner.temp }}/computer-host-windows/
          if-no-files-found: error
          retention-days: 7
  assemble:
    name: Validate release asset set (no publication)
    needs: [linux-source, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download release candidate components
        uses: actions/download-artifact@v8
        with:
          pattern: computer-host-release-*
          path: ${{ runner.temp }}/computer-host-release/
          merge-multiple: true
      - name: Check source and Windows assets and write unified SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/computer-host-release"
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          sha256sum -c ./*.zip.sha256
          sha256sum -c ./computer-host-lan-v*-SHA256SUMS.txt
          sha256sum -- *.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          printf '%s\n' \
            "Computer Host LAN unsigned development candidate" \
            "Commit: $GITHUB_SHA" \
            "Not a published GitHub release; SmartThings beta invitation pending." \
            "Windows 11 physical mDNS/power/WOL tests remain outstanding." \
            > RELEASE-CANDIDATE-NOTICE.txt
          ls -lh *.zip SHA256SUMS.txt
      - name: Upload one complete unsigned beta-candidate set
        uses: actions/upload-artifact@v7
        with:
          name: computer-host-lan-complete-unsigned-beta-candidate
          path: ${{ runner.temp }}/computer-host-release/
          if-no-files-found: error
          retention-days: 7
